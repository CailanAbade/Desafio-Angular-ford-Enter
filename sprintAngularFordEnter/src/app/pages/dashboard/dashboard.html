<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/Geral.css">
    <link rel="stylesheet" href="/css/Dashboard.css">
    <title>Dashboard</title>
</head>
<body>
    <header>
        <img id="menu" src="/img/icons8-cardápio.svg" alt="Menu hamburguer">
    </header>   
    
    <main>
        <div id="frase">
            <h1>Dashboard FORD</h1>
        </div>

        <div class="informacoes">


            <div class="veiculo">
                <p>Veículo</p>
                <select class="opcoes" name="" id="">
                    <option selected disabled hidden value="">Selecione uma opção</option>
                    <option value="">Ranger</option>
                    <option value="">Mustang</option>
                    <option value="">Temtory</option>
                    <option value="">Bronco sport</option>
                </select>
            </div>


            <div class="totalDeVendas">
                <p>Total de Vendas</p>
                <span id="numeros">1500</span>
                <span>Und.</span>
            </div>


            <div  class="conectados">
                <p>Conectados</p>
                <span id="numeros">500</span>
                <span>Und.</span>
            </div>


            <div class="updateSoftware">
                <p>Update Software</p>
                <span id="numeros">750</span>
                <span>Und.</span>
            </div>


        </div>


        <div class="carros">
            <img src="/img/mustang.png" alt="Ford-Mustang">
        </div>


        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Código - vin</th>
                        <th>Odrômetro</th>
                        <th>Nível de Combustivel</th>
                        <th>Status</th>
                        <th>lat.</th>
                        <th>Long.</th>
                    </tr>
                </thead>
                   
                <tbody>
                     <tr>
                        <td><input type="text"></td>
                        <td>50000KM</td>
                        <td>90%</td>
                        <td>on</td>
                        <td>-12,2322</td>
                        <td>-35,2314</td>
                    </tr>
                </tbody>
                <tfoot class="ada">
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tfoot>
            </table>
        </div>

    </main>
    
</body>
</html>
