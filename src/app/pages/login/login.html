    <main>
        <div id="carro">
            <img src="/img/ranger.png" alt="Ford ranger vermelha">
        </div>

        <div id="login">
            <img src="/img/ford.png" alt="Logo-ford">
            <span id="texto1">Boas-vindas</span>
            <div>
            </div>
            <form (ngSubmit)="login()">
                <div class="campo-login">
                    <div class="campo-email">
                        <input placeholder="insira o seu email" type="text" [(ngModel)]="usuario.nome" name="nome">
                    </div>
                    <input placeholder="insira a sua senha" type="password" [(ngModel)]="usuario.senha" name="senha">
                </div>

                <button type="submit" id="botao">Entrar</button>
            </form>
        </div>
        
    </main>
